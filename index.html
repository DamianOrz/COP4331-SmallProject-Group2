<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>COP 4331  - Small Project - Group 2</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Contact Manager — sign in to manage your contacts.">
	<script type="text/javascript" src="js/md5.js"></script>
	<script type="text/javascript" src="js/code.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="css/styles.css" rel="stylesheet">	
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
</head>
<body>

<main>
	<div id="loginDiv">
		<div class="avatar-container">
			<i class="fa-solid fa-user-secret"></i>
		</div>
		 <h1 id="title" class="logo-text">
            <span class="solid">CON</span><span class="faded">TACT</span> 
            <span class="solid">MAN</span><span class="faded">AGER</span>
        </h1>
		<span id="inner-title">Sign in to your account</span>
		
		<div class = "input-group">
			<label for="loginName">Username:</label>
			<div class ="input-wrapper">
				<i class="fa-regular fa-user input-icon"></i>
				<input type="text" id="loginName" placeholder="Enter your username" />
			</div>
		</div>

		<div class = "input-group">
			<label for="loginPassword">Password:</label>
			<div class ="input-wrapper">
				<i class="fa-solid fa-lock input-icon"></i>
				<input type="password" id="loginPassword" placeholder="•••••"/>
			</div>
		</div>


		<button type="button" id="loginButton" class="buttons" onclick="doLogin();"> Sign In</button>

		<div class = "footer-text">
			Don’t have an account? <span id="registerButton" class="registerLink" onclick="window.location.href='register.html';">Sign up.</span>
		</div>

		<span id="loginResult"></span>

	</div>
</main>

</body>
</html>

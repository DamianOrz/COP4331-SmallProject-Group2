<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COP 4331 - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Manager — register to manage your contacts.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="css/register.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
</head>
<body>

<div id="loginDiv">
    <div class="avatar-container">
       <i class="fa-solid fa-circle-user"></i>
    </div>

    <h1 id="title">Contact Manager</h1>
    <span id="inner-title">Create your Account</span>

    <div class = "input-row">
        <div class = "input-group">
            <label for="firstName">First Name:</label>
            <div class="input-wrapper simple-input">
                <input type="text" id="firstName" placeholder="John" />
            </div>
        </div>

        <div class = "input-group">
            <label for="lastName">Last Name:</label>
            <div class="input-wrapper simple-input">
                <input type="text" id="lastName" placeholder="Doe" />
            </div>
        </div>
    </div>

    <div class="input-group full-width">
        <label for="registerName">Username:</label>
        <div class="input-wrapper simple-input">
            <input type="text" id="registerName" placeholder="ex. johndoe03" />
        </div>
    </div>

    <div class="input-group full-width">
        <label for="registerPassword">Password:</label>
        <div class="input-wrapper">
            <input type="password" id="registerPassword" placeholder="....." />
        </div>
        <div id="passwordRequirementsMsg" aria-live="polite">
            <h3>Password must contain the following:</h3>
            <p id="letter" class="invalid"><span class="req-icon" aria-hidden="true">✖</span> A <b>lowercase</b> letter</p>
            <p id="capital" class="invalid"><span class="req-icon" aria-hidden="true">✖</span> A <b>capital (uppercase)</b> letter</p>
            <p id="number" class="invalid"><span class="req-icon" aria-hidden="true">✖</span> A <b>number</b></p>
            <p id="length" class="invalid"><span class="req-icon" aria-hidden="true">✖</span> Minimum <b>8 characters</b></p>
        </div>
    </div>

    <button type="button" id="registerButton" class="buttons" onclick="doRegister();"> Register </button>

    
    <div class = "footer-text">
        Already have an account? <span id="loginLink" class="registerLink" onclick="window.location.href='index.html';">Sign in.</span>
    </div>

    <span id="loginResult"></span>


</div>
<script type="text/javascript" src="js/code.js"></script>
</body>
</html>

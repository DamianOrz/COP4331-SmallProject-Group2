<html>
<head>
    <title>COP 4331 - Contacts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="js/code.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="css/contacts.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">

    <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() 
    {
        readCookie();
    }, false);
    </script>
</head>
<body>

<div class="dashboard-wrapper">
    
    <header class="dashboard-header">
        <div class="header-brand">
            <div class="avatar-container">
                <i class="fa-solid fa-circle-user"></i>
            </div>
            <h1 id="title">Contact Manager</h1>
        </div>
        <div class="header-user">
            <span>Welcome, <span id="userName"></span></span>
            <button type="button" id="logoutButton" class="btn-logout" onclick="doLogout();">Log Out</button>
        </div>
    </header>

    <main class="dashboard-container">
        
        <aside class="sidebar-card">
            <h2>Add a Contact</h2>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="firstNameText">First Name:</label>
                    <input type="text" id="firstNameText" placeholder="John" />
                </div>
                <div class="input-group">
                    <label for="lastNameText">Last Name:</label>
                    <input type="text" id="lastNameText" placeholder="Doe" />
                </div>
            </div>

            <div class="input-group">
                <label for="emailText">Email:</label>
                <input type="text" id="emailText" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="phoneText">Phone Number:</label>
                <input type="text" id="phoneText" placeholder="(555) 555-5555" />
            </div>

            <button type="button" class="btn-primary" onclick="addContact();">Add Contact</button>
            <span id="contactAddResult"></span>
        </aside>

        <section class="main-content">
            
            <div class="search-box">
                <div class="search-row">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="searchText">Search Contacts:</label>
                        <input type="text" id="searchText" placeholder="Enter name to search" />
                    </div>
                    <button type="button" class="btn-primary btn-search" onclick="searchContact();">Search</button>
                </div>
                <div class="search-actions">
                    <button type="button" class="btn-secondary" onclick="searchContact('');">Show All</button>
                    <button type="button" class="btn-secondary" onclick="clearSearchResults();">Clear Results</button>
                </div>
            </div>

            <div class="contacts-display-section">
                <h2>Your Contacts</h2>
                <div id="contactList">
                    <h3 style="font-style: italic; display: flex; justify-content: center; align-items: center; height: inherit">Start searching to see your contacts!</h3>
                </div>
            </div>

        </section>
    </main>
</div>
</body>
</html>
